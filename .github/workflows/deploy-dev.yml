name: Deploy to dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Build and deploy frontend to dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myportfolio

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: myportfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Copy environment file
        run: |
          if [ -f .env.dev ]; then
            cp .env.dev .env.local
            echo "Using .env.dev"
          else
            echo "WARNING: .env.dev not found"
          fi

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload index.html with no-cache
        run: |
          aws s3 cp build/index.html s3://${{ secrets.S3_BUCKET_DEV }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Sync assets with long-term cache
        run: |
          aws s3 sync build s3://${{ secrets.S3_BUCKET_DEV }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID_DEV }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "Deployed to dev successfully"
          echo "Live URL: https://d1bu5pjn9pv633.cloudfront.net"
